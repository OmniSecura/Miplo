[project]
name = "miplo"
version = "0.0.1"
description = "Miplo — board game shelf & community app"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "firebase-admin",
    "httpx",
    "defusedxml",
    "redis",
    "slowapi",
    "limits",
    "email-validator",
    "pillow",
    "python-multipart",
    "python-slugify",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
